name: CI

# Tests, lint and format run on every pull request and every push to main, so
# nothing reaches a release untested. Building and publishing only happen on
# version tags.
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Least privilege: jobs that only test read the repo; build-and-push grants its own.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sauron

jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (race detector)
        run: make test

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: GolangCI-Lint (version pinned in Makefile)
        run: make lint

  go-fmt-check:
    name: Go Format Check (gofmt + goimports)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt and goimports (versions pinned in Makefile)
        run: make fmt-check

  l3-protocols:
    name: L3 Protocols and Failover (fake nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run deterministic L3 suite (REST, RPC GET/POST, WebSocket, gRPC, failover)
        run: make docker-test-protocols

  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go-test, go-lint, go-fmt-check, l3-protocols]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NO_V=${VERSION#v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NO_V=${VERSION_NO_V}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Build for linux/amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${VERSION} -extldflags '-static'" \
            -o sauron-${VERSION}-linux-amd64 \
            .

          # Build for linux/arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${VERSION} -extldflags '-static'" \
            -o sauron-${VERSION}-linux-arm64 \
            .

          # Build for darwin/amd64 (Intel Mac)
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o sauron-${VERSION}-darwin-amd64 \
            .

          # Build for darwin/arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o sauron-${VERSION}-darwin-arm64 \
            .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./.docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract tag annotation
        id: tag_annotation
        run: |
          TAG_MESSAGE=$(git tag -l --format='%(contents)' ${{ steps.version.outputs.VERSION }})
          # Use multiline output for GitHub Actions
          {
            echo 'TAG_MESSAGE<<EOF'
            echo "$TAG_MESSAGE"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.3
        with:
          generate_release_notes: true
          files: |
            sauron-${{ steps.version.outputs.VERSION }}-linux-amd64
            sauron-${{ steps.version.outputs.VERSION }}-linux-arm64
            sauron-${{ steps.version.outputs.VERSION }}-darwin-amd64
            sauron-${{ steps.version.outputs.VERSION }}-darwin-arm64
          body: |
            ${{ steps.tag_annotation.outputs.TAG_MESSAGE }}

            ---

            ## Docker Image

            ```bash
            # Pull with version tag
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION_NO_V }}

            # Or pull latest release
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ```

            ### Available tags:
            ${{ steps.meta.outputs.tags }}

            ### Platforms:
            - linux/amd64
            - linux/arm64

            ## Binaries

            Download the pre-built binaries for your platform:

            - **Linux (amd64)**: `sauron-${{ steps.version.outputs.VERSION }}-linux-amd64`
            - **Linux (arm64)**: `sauron-${{ steps.version.outputs.VERSION }}-linux-arm64`
            - **macOS (Intel)**: `sauron-${{ steps.version.outputs.VERSION }}-darwin-amd64`
            - **macOS (Apple Silicon)**: `sauron-${{ steps.version.outputs.VERSION }}-darwin-arm64`
