services:
  # Redis for distributed state sharing
  redis:
    image: redis:7-alpine
    container_name: sauron-redis
    hostname: redis
    ports:
      - "${SAURON_REDIS_PORT:-6379}:6379"
    networks:
      - sauron-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Secondary Sauron instance (leaf node)
  secondary:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: sauron-secondary
    hostname: secondary
    ports:
      - "${SAURON_SECONDARY_STATUS_PORT:-4000}:4000"   # Status API
      - "${SAURON_SECONDARY_API_PORT:-7080}:7080"   # Network API proxy
      - "${SAURON_SECONDARY_RPC_PORT:-7081}:7081"   # Network RPC proxy
      - "${SAURON_SECONDARY_GRPC_PORT:-7082}:7082"   # Network gRPC proxy
    volumes:
      - ./config-secondary-docker.yaml:/app/config.yaml:ro
    networks:
      - sauron-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Primary Sauron instance (queries secondary as external ring)
  primary:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: sauron-primary
    hostname: primary
    ports:
      - "${SAURON_PRIMARY_STATUS_PORT:-3000}:3000"   # Status API
      - "${SAURON_PRIMARY_API_PORT:-8080}:8080"   # Network API proxy
      - "${SAURON_PRIMARY_RPC_PORT:-8081}:8081"   # Network RPC proxy
      - "${SAURON_PRIMARY_GRPC_PORT:-8082}:8082"   # Network gRPC proxy
    volumes:
      - ./config-primary-docker.yaml:/app/config.yaml:ro
    networks:
      - sauron-net
    depends_on:
      redis:
        condition: service_healthy
      secondary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  sauron-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
