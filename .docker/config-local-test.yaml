# Full feature test: archival, sync filter, round-robin, multi-chain
listen: ":3000"
auth: false

timeouts:
  health_check: 10s
  proxy: 60s

grpc_keepalive:
  time: 600s
  timeout: 20s

rate_limit:
  enabled: true
  requests_per_second: 50
  burst: 100
  trust_proxy: false

redis:
  enabled: false

networks:
  # Cosmos — Pocket beta-lego (3 nodes, round-robin)
  - name: pocket-beta
    type: cosmos
    height_check:
      protocol: rpc
      interval: 10s
    endpoints:
      - protocol: rest
        listen: ":8080"
      - protocol: rpc
        listen: ":8081"

  # EVM — Optimism with ARCHIVAL + SYNC + CIRCUIT BREAKER
  - name: optimism
    type: evm
    mode: latest
    height_check:
      interval: 10s
    endpoints:
      - protocol: jsonrpc
        listen: ":9080"
    archival:
      min_height: 1
      check_interval: 5m
    sync:
      max_drift: 5
      check_interval: 30s
      oracles:
        - url: "https://mainnet.optimism.io"
    circuit_breaker:
      http_codes: [429, 500, 502, 503]
      threshold: 3
      retry_attempts: 2
      retry_backoff: 100ms

  # EVM — BSC (2 nodes, round-robin)
  - name: bsc
    type: evm
    mode: latest
    height_check:
      interval: 5s
    endpoints:
      - protocol: jsonrpc
        listen: ":9081"

  # Custom — Bitcoin
  - name: bitcoin
    type: custom
    height_check:
      interval: 30s
      method: GET
      url_path: /api/blocks/tip/height
      response_path: "."
      response_format: integer
    endpoints:
      - protocol: http
        listen: ":9280"

internals:
  # Cosmos — 3 nodes
  - name: validator-one
    network: pocket-beta
    endpoints:
      rest: "https://api-validator-one-lego.beta.infra.pocket.network"
      rpc: "https://rpc-validator-one-lego.beta.infra.pocket.network"
  - name: validator-two
    network: pocket-beta
    endpoints:
      rest: "https://api-validator-two-lego.beta.infra.pocket.network"
      rpc: "https://rpc-validator-two-lego.beta.infra.pocket.network"
  - name: seed-one
    network: pocket-beta
    endpoints:
      rest: "https://api-seed-one-lego.beta.infra.pocket.network"
      rpc: "https://rpc-seed-one-lego.beta.infra.pocket.network"

  # Optimism — two public nodes for archival testing
  # mainnet.optimism.io is archival (has block 1)
  # op.api.pocket.network is pruned (no block 1)
  - name: op-archival
    network: optimism
    endpoints:
      jsonrpc: "https://mainnet.optimism.io"

  - name: op-pruned
    network: optimism
    endpoints:
      jsonrpc: "https://op.api.pocket.network"

  # BSC — 2 nodes for round-robin
  - name: bsc-pocket
    network: bsc
    endpoints:
      jsonrpc: "https://bsc.api.pocket.network"
  - name: bsc-publicnode
    network: bsc
    endpoints:
      jsonrpc: "https://bsc-rpc.publicnode.com"

  # Bitcoin
  - name: btc-mempool
    network: bitcoin
    endpoints:
      http: "https://mempool.space"

externals: []
users: []
