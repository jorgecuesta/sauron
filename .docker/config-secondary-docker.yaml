listen: ":4000"
auth: true

timeouts:
  health_check: 5s
  proxy: 60s

redis:
  enabled: true
  uri: "redis://redis:6379/0"

networks:
  - name: pocket
    type: cosmos
    height_check:
      protocol: rpc
      interval: 30s
    endpoints:
      - protocol: rest
        listen: ":7080"
        advertise: "http://secondary:7080"
      - protocol: rpc
        listen: ":7081"
        advertise: "http://secondary:7081"
      - protocol: grpc
        listen: ":7082"
        advertise: "secondary:7082"

internals:
  - name: seed-two
    network: pocket
    endpoints:
      rest: "https://api-seed-two.infra.pocket.network"
      rpc: "https://rpc-seed-two.infra.pocket.network"
      grpc: "grpc-seed-two.infra.pocket.network:443"

  - name: seed-three
    network: pocket
    endpoints:
      rest: "https://api-seed-three.infra.pocket.network"
      rpc: "https://rpc-seed-three.infra.pocket.network"
      grpc: "grpc-seed-three.infra.pocket.network:443"

externals: []

users:
  - name: test-user
    token: "test-token-123"
    permissions: all
