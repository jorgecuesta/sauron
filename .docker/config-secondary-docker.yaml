api: true
rpc: true
grpc: true
auth: true
listen: ":4000"

timeouts:
  health_check: 5s
  proxy: 60s

redis:
  enabled: true
  uri: "redis://redis:6379/0"

networks:
  - name: "pocket"
    api: "http://secondary:7080"
    api_listen: ":7080"
    rpc: "http://secondary:7081"
    rpc_listen: ":7081"
    grpc: "secondary:7082"
    grpc_listen: ":7082"
    grpc_insecure: true

internals:
  - name: seed-two
    api: "https://api-seed-two.infra.pocket.network"
    rpc: "https://rpc-seed-two.infra.pocket.network"
    grpc: "grpc-seed-two.infra.pocket.network:443"
    grpc_insecure: false
    network: "pocket"

  - name: seed-three
    api: "https://api-seed-three.infra.pocket.network"
    rpc: "https://rpc-seed-three.infra.pocket.network"
    grpc: "grpc-seed-three.infra.pocket.network:443"
    grpc_insecure: false
    network: "pocket"

externals: []

users:
  - name: test-user
    token: "test-token-123"
    api: true
    rpc: true
    grpc: true
